<form action="{{action}}">
    <table>
        <tr><td><label for="college">College: </label><input type="text" name="college" id="college" {% if request.GET.college %} value="{{request.GET.college}}" {% endif %}></td>
            <td><label for="department">Department: </label><input type="text" name="department" id="department" {% if request.GET.department%} value="{{request.GET.department}}" {% endif %}></td>
            <td><label for="course_number">Course Number: </label><input type="text" name="course_number" id="course_number"  {% if request.GET.course_number %} value="{{request.GET.course_number}}" {% endif %}></td>
            <td><label for="section_number">Section Number: </label><input type="text" name="section_number" id="section_number" {% if request.GET.section_number %} value="{{request.GET.section_number}}" {% endif %}></td>
            <td><input type="submit" name="submit" value="Search"></td></tr>
    </table>
</form>
