{% load static %}
<html>
    <head>
        <title>Course Swap App</title>
        <link rel="stylesheet" href="{% static 'styles.css' %}">
    </head>
    <body>
        <nav>
            <ul>
                <li id="nav"><a href="{% url 'show_all' %}">All Interests</a></li>
                {% if request.user.is_authenticated %}
                <li id="nav"><a href="{% url 'my_interests' %}">My Interests</a></li>
                <li id="nav"><a href="{% url 'my_profile' %}">View My Profile</a></li>
                <li id="nav">
                    <form method="post" action="{% url 'logout' %}" style="display:inline;">
                        {% csrf_token %}
                        <button type="submit">Logout</button>
                    </form>
                </li>
            {% else %}
                <li id="nav"><a href="{% url 'create_student' %}">New Student</a></li>
                <li id="nav"><a href="{% url 'login' %}">Login</a></li>
            {% endif %}
            </ul>
        </nav>
        {% block content %}
        {% endblock %}
    </body>
    <footer>
        <p>Course Swap. Built by Kaylie.</p>
    </footer>
</html>
